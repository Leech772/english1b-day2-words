]),GRAMMAR:[
{h:"① be 动词是什么？",t:"英语里表示「是 / 在」要用 <b>be 动词</b>：am / is / are。它会跟着人称变。<br>I → <b>am</b>；he / she / it → <b>is</b>；you / we / they → <b>are</b>。"},
{h:"② 缩写（口语常用）",t:"I am = <b>I'm</b>；you are = <b>you're</b>；he is = <b>he's</b>；she is = <b>she's</b>；it is = <b>it's</b>；we are = <b>we're</b>；they are = <b>they're</b>。",s:["I'm Samuel Anderson.","She's from Britain.","They're classmates."]},
{h:"③ 否定与疑问",t:"否定：am not / is not (isn't) / are not (aren't)。<br>疑问：把 be 提前 —— Are you…? Is she…?<br>简答：Yes, I am. / No, she isn't.（单独简答时 I am 通常不缩写）",s:["Are you from the US?","Yes, I am.","Is he a tour guide?","No, he isn't."]},
{h:"④ 常见错误对比",t:"<span class='wrongc'>He am a doctor.</span> → <span class='rightc'>He is a doctor.</span><br><span class='wrongc'>We is glad to meet you.</span> → <span class='rightc'>We are glad to meet you.</span><br><span class='wrongc'>She are from Liverpool.</span> → <span class='rightc'>She is from Liverpool.</span>"},
{say:"你来说一句：用 I'm… 自我介绍。参考：I'm Li Ming. Nice to meet you!",s:["I'm Li Ming. Nice to meet you!"]},
{h:"⑤ 一般现在时：做什么？",t:"表示习惯、事实、爱好。I/You/We/They + 动词原形；He/She/It + 动词加 -s/-es。<br>like → likes；study → studies（辅音+y 变 i 再加 es）。",s:["He likes swimming.","She studies English.","They play basketball in their free time."]},
{h:"⑥ 否定与疑问",t:"否定：don't / doesn't + 动词原形。<br>疑问：Do you…? / Does she…? → Yes, I do. / No, she doesn't。<br><b>注意：</b>doesn't / Does 后面动词必须用原形！",s:["She doesn't like stressful jobs.","Does he work in a travel agency?","Do they collect stamps?"]},
{h:"⑦ 常见错误对比",t:"<span class='wrongc'>She doesn't likes piano.</span> → <span class='rightc'>She doesn't like the piano.</span><br><span class='wrongc'>He like swimming.</span> → <span class='rightc'>He likes swimming.</span><br><span class='wrongc'>Does she works here?</span> → <span class='rightc'>Does she work here?</span>"},
{say:"你来说一句：说说你的爱好。参考：I like playing basketball in my free time.",s:["I like playing basketball in my free time."]},
{say:"你来说一句：说说朋友的工作。参考：She works as a receptionist.",s:["She works as a receptionist."]}
],DIALOGUES:[
{h:"对话 1 · 自我介绍与昵称（Unit 1）",l:[
["A","Hello! My name is William. Just call me Bill.","你好！我叫威廉，就叫我比尔吧。"],
["B","Nice to meet you, Bill. I'm Elizabeth. You can call me Lisa.","很高兴见到你，比尔。我叫伊丽莎白，你可以叫我丽莎。"],
["A","Glad to meet you, Lisa. How do you spell your full name?","很高兴见到你，丽莎。你的全名怎么拼？"],
["B","E-L-I-Z-A-B-E-T-H. And my family name is Baker.","E-L-I-Z-A-B-E-T-H。我姓贝克。"],
["A","Thanks. Nice to meet you!","谢谢。很高兴认识你！"]],say:"你来说一句：介绍自己并给出昵称。Hello! My name is… Just call me…"},
{h:"对话 2 · Ella & Samuel（Unit 1）",l:[
["Ella","Hi! I'm Ella Baker. I'm from Britain, Liverpool.","嗨！我是埃拉·贝克。我来自英国利物浦。"],
["Samuel","Nice to meet you, Ella! I'm Samuel Anderson. I'm from the US, New York.","很高兴见到你，埃拉！我是塞缪尔·安德森。我来自美国纽约。"],
["Ella","Glad to meet you, Samuel. Are you a student here?","很高兴见到你，塞缪尔。你是这里的学生吗？"],
["Samuel","Yes, I am. And you?","是的。你呢？"],
["Ella","I'm a student too. We're classmates now!","我也是学生。我们现在是同班同学了！"]],say:"你来说一句：说说你来自哪里。I'm from… Nice to meet you!"},
{h:"对话 3 · 工作与爱好（Unit 2）",l:[
["Li","Hi, Sally. What do you do?","嗨，萨莉。你做什么工作？"],
["Sally","I'm a cashier. The job is a bit stressful.","我是收银员。工作有点压力大。"],
["Li","I see. What do you do in your free time?","明白。你业余时间做什么？"],
["Sally","I watch TV, but it's boring. What about you?","我看电视，但很无聊。你呢？"],
["Li","I play the piano and go swimming. They can release stress.","我弹钢琴、游泳。它们能释放压力。"],
["Sally","That sounds interesting! Maybe I should try.","听起来很有趣！也许我也该试试。"]],say:"你来说一句：建议朋友换个爱好释放压力。You can play the piano to release stress."}
],QUIZ:[
{t:"c",q:"_____ Samuel Anderson. Nice to meet you!",o:["I am","I is","I are","Me am"],a:0,e:"第一人称单数用 am。"},
{t:"c",q:"She _____ from Britain.",o:["am","is","are","be"],a:1,e:"she/he/it 用 is。"},
{t:"c",q:"They _____ students.（= they are）",o:["they're","they's","them're","their"],a:0,e:"they are → they're。"},
{t:"c",q:"— Is she a receptionist? — No, _____.",o:["she isn't","she aren't","she doesn't","she not"],a:0,e:"对 is 提问用 isn't。"},
{t:"c",q:"He _____ swimming every weekend.",o:["like","likes","liking","liked"],a:1,e:"第三人称单数动词加 -s。"},
{t:"c",q:"She _____ English at school.",o:["study","studys","studies","studyies"],a:2,e:"辅音+y → ies：studies。"},
{t:"c",q:"He _____ like stressful jobs.",o:["don't","doesn't","isn't","aren't"],a:1,e:"第三人称否定用 doesn't + 原形。"},
{t:"c",q:"_____ he work in a travel agency?",o:["Do","Does","Is","Are"],a:1,e:"第三人称疑问用 Does。"},
{t:"c",q:"情境：第一次见面，你想礼貌问候，应说：",o:["Who are you?","Nice to meet you!","Give me your name.","You must tell me."],a:1,e:"Nice to meet you! 是标准问候。"},
{t:"c",q:"情境：朋友工作压力大，你建议：",o:["You should hate your job.","You can play the piano to release stress.","Don't have free time.","Jobs are always boring."],a:1,e:"建议用更好的爱好释放压力。"},
{t:"f",q:"I am 的缩写是 I'm。请填：I___（只填 'm 或 m）",a:["'m","m","I'm"],e:"I am = I'm。"},
{t:"f",q:"— Are you from the US? — Yes, I ___.",a:["am"],e:"肯定简答：Yes, I am."},
{t:"f",q:"She doesn't _____ playing the piano.（like 原形）",a:["like"],e:"doesn't 后用动词原形。"},
{t:"f",q:"Anderson is my f______ name.（姓）",a:["family"],e:"family name 姓。"},
{t:"f",q:"What do you do in your f______ time?（业余）",a:["free"],e:"free time 业余时间。"},
{t:"f",q:"He works as a tour g______.（导游）",a:["guide"],e:"tour guide 导游。"},
{t:"f",q:"Music can r______ stress.（释放）",a:["release"],e:"release stress 释放压力。"},
{t:"o",q:"连词成句：from / she / Britain / is / .",a:["she is from britain.","she is from britain"],e:"She is from Britain."},
{t:"o",q:"连词成句：likes / he / swimming / .",a:["he likes swimming.","he likes swimming"],e:"He likes swimming."},
{t:"o",q:"连词成句：meet / nice / to / you / .",a:["nice to meet you.","nice to meet you"],e:"Nice to meet you."},
{t:"c",q:"We _____ glad to meet you.",o:["is","am","are","be"],a:2,e:"we 搭配 are。"},
{t:"c",q:"— Does she collect stamps? — No, she _____.",o:["don't","doesn't","isn't","aren't"],a:1,e:"Does 问句否定简答用 doesn't。"},
{t:"c",q:"Just _____ me Bill.",o:["call","calls","calling","called"],a:0,e:"祈使/建议用原形 call。"},
{t:"c",q:"How do you _____ your full name?",o:["spell","spells","spelling","spelled"],a:0,e:"do 后用原形 spell。"},
{t:"f",q:"She works as a r____________.（接待员）",a:["receptionist"],e:"receptionist 接待员。"}

["A","Excuse me, officer. How can I get to the airport?","警官，打扰一下，我怎么去机场？"],
["C","You can take Subway Line 8 and get off at Airport Station.","您可以坐地铁 8 号线，在机场站下车。"],
["A","Where is the subway station?","地铁站在哪儿？"],
["C","It's just around the corner. Walk one block and turn left at the traffic lights.","就在拐角处。走过一个街区，在红绿灯处左转。"],
["A","Thank you very much. You are very friendly.","非常感谢，您真友好。"],

{h:"对话 2 · 北京四季（Unit 6）",l:[
["A","What's the weather like in Beijing?","北京的天气怎么样？"],
["B","Beijing has four seasons.","北京四季分明。"],
["B","Winter is cold and snowy.","冬天寒冷多雪。"],
["B","Spring is warm and windy, and it is the shortest season.","春天温暖多风，是最短的季节。"],
["B","Summer is rainy and hot.","夏天多雨炎热。"],
["B","Autumn is cool and sunny. It is the best season in Beijing.","秋天凉爽晴朗，是北京最好的季节。"],
["A","Which season do you like best?","你最喜欢哪个季节？"],
["B","I like autumn best. It is sunny most of the time.","我最喜欢秋天，大多数时候都是晴天。"]],say:"你来说一句：说说你家乡的天气。My hometown is warm and rainy in spring."},
{h:"对话 3 · 大雪天：去海南还是哈尔滨？（Unit 6）",l:[
["A","It snowed heavily last night. The weather is terrible!","昨晚雪下得很大，天气糟透了！"],
["B","Yes. The weather forecast says it will be ten degrees below zero tomorrow.","是啊。天气预报说明天零下十度。"],
["A","I don't like cold weather. I'm going to spend the winter in Hainan.","我不喜欢冷天。我打算去海南过冬。"],
["B","That sounds nice. But I love snow. I'm going to Harbin to see the ice lanterns.","听起来不错。但我喜欢雪，我要去哈尔滨看冰灯。"],
["A","It will be very cold there. Take warm clothes.","那里会很冷，带上暖和的衣服。"],
["B","I will. Will it be hot in Hainan?","我会的。海南会很热吗？"],
["A","A little bit. The temperature is about 25 degrees Celsius, and there is a chance of rain. I'll take an umbrella.","有一点。气温大约 25 摄氏度，可能会下雨，我会带把伞。"]],say:"你来说一句：寒假你打算去哪儿？I am going to visit Harbin this winter."}

const _audioPool={};
function _getAudio(t){

  const rev=!!ws.revealed;$("card").classList.toggle("rev",rev);$("ex").classList.toggle("show",rev);
  $("hintBox").classList.toggle("dim",rev);
  $("nextArea").style.display=rev?"":"none";$("inputArea").style.display=rev?"none":"";
}
function reveal(msg,cls){S().w.revealed=true;$("fb").textContent=msg;$("fb").className="fb "+cls;save();renderWords();$("bNext").focus();}
function markMiss(id,need){const ws=S().w;ws.reps[id]=Math.max(ws.reps[id]||0,need);if(!ws.missed.includes(id))ws.missed.push(id);ws.known=ws.known.filter(x=>x!==id);ws.pending="later";}
$("bSub").onclick=()=>{if(!ALL.day)return;const w=cur();if(!w)return;const v=norm($("ans").value);if(!v){$("ans").focus();return;}const ws=S().w;
 if(v===norm(w.en)){const n=ws.reps[w.id]||0;
  if(n>1){ws.reps[w.id]=n-1;ws.pending="later";reveal("✅ 拼对了！还要再拼对 "+(n-1)+" 次，稍后再出现","ok");}
  else{delete ws.reps[w.id];ws.pending="done";reveal("✅ 正确！已掌握","ok");}
 }else{markMiss(w.id,REP_NO);reveal("❌ 拼错了，正确是 "+w.en+"（你写的："+$("ans").value+"），稍后要再拼对 3 次","bad");}
 S().log.push([Date.now(),w.en,v===norm(w.en)?"ok":"wrong"]);save();};
$("bFuz").onclick=()=>{if(!ALL.day)return;const w=cur();if(!w)return;markMiss(w.id,REP_FUZZY);S().log.push([Date.now(),w.en,"fuzzy"]);reveal("🟡 模糊：看清 "+w.en+"，稍后再拼对 2 次","mid");};
$("bNo").onclick=()=>{if(!ALL.day)return;const w=cur();if(!w)return;markMiss(w.id,REP_NO);S().log.push([Date.now(),w.en,"no"]);reveal("🔴 不会：正确是 "+w.en+"，跟读两遍，稍后再拼对 3 次","bad");speak(w.en);};
function next(){const ws=S().w,w=cur();if(!w)return;
 if(ws.pending==="later")insertLater(w.id);else{ws.queue.shift();if(!ws.known.includes(w.id))ws.known.push(w.id);ws.queue=ws.queue.filter(x=>x!==w.id||(ws.reps[x]||0)>0);}
 ws.pending=null;ws.revealed=false;if(!ws.queue.length)startFinal();
 $("ans").value="";$("fb").textContent="";save();renderWords();if(S().auto&&cur())speak(cur().en);$("ans").focus();}
$("bNext").onclick=next;
$("ans").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("bSub").click();}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&ALL.day&&S().tab==="words"&&S().w.revealed&&document.activeElement!==$("ans")){e.preventDefault();next();}});
$("sp").onclick=()=>{const w=cur();if(w)speak(w.en);};$("spSlow").onclick=()=>{const w=cur();if(w)speak(w.en,true);};
$("spEx").onclick=()=>{const w=cur();if(w)speak(w.exEn);};$("spExS").onclick=()=>{const w=cur();if(w)speak(w.exEn,true);};
$("auto").onchange=e=>{if(!ALL.day)return;S().auto=e.target.checked;save();};
$("bRestart").onclick=()=>{if(!ALL.day)return;if(!confirm("重新开始本天单词一轮？"))return;const v=S().voice,a=S().auto;ALL.days[ALL.day]=dayDefault(ALL.day);S().voice=v;S().auto=a;save();renderWords();};

function renderGrammar(){
  $("p-grammar").innerHTML='<div class="g"><h3>'+DAYS[ALL.day].gTitle+'</h3>先看中文讲解，每个英文句子点 🔊 听、点 🐢 慢速跟读，读 3 遍。</div>'+
  GRAMMAR().map(g=>g.say?`<div class="say">🗣️ ${g.say}${(g.s||[]).map(s=>'<div class="sent">'+s+spkBtns(s)+'</div>').join("")}</div>`:
  `<div class="g"><h3>${g.h}</h3><div>${g.t}</div>${(g.s||[]).map(s=>'<div class="sent">👉 '+s+spkBtns(s)+'</div>').join("")}</div>`).join("");
}
function renderDialogue(){
  $("p-dialogue").innerHTML='<div class="g">点 🔊 听原句，点 🐢 慢速跟读；先看中文，再读英文。读完整段可点「▶ 连读全文」。</div>'+
  DIALOGUES().map((d,k)=>`<div class="g dl"><h3>${d.h} <button class="mini" data-play="${k}">▶ 连读全文</button></h3>${d.l.map(l=>`<div class="ln"><div class="sent"><span class="who">${l[0]}:</span>${l[1]}${spkBtns(l[1])}</div><div class="zhl">${l[2]}</div></div>`).join("")}<div class="say" style="margin-top:8px">🗣️ ${d.say}</div></div>`).join("");
  $("p-dialogue").querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();DIALOGUES()[b.dataset.play].l.forEach(l=>{const u=new SpeechSynthesisUtterance(l[1]);if(voice)u.voice=voice;u.lang=voice?voice.lang:"en-GB";u.rate=1.0;speechSynthesis.speak(u);});});
}
function isRight(i,v){const q=QUIZ()[i];if(q.t==="c")return v===q.a;return q.a.map(norm).includes(norm(String(v)));}
function renderQuiz(){
  const P=$("p-quiz");const QZ=QUIZ();const st=S();
  const done=Object.keys(st.q.ans).length,right=Object.keys(st.q.ans).filter(i=>isRight(+i,st.q.ans[i])).length;
  const typeName={c:"选择",f:"填空",o:"排序"};
  let h=`<div class="g"><h3>📝 小测 ${QZ.length} 题</h3>已答 ${done}/${QZ.length}，答对 ${right}。选择题点选项；填空/排序输入后按「确定」。答错会显示解释并进入错题本。<div class="row" style="margin-top:6px"><button class="danger" id="qReset">清空重做</button></div></div>`;
  QZ.forEach((q,i)=>{const has=i in st.q.ans,ok=has&&isRight(i,st.q.ans[i]);
   h+=`<div class="g"><b>${i+1}. ${typeName[q.t]}</b>　${q.q}`;
   if(q.t==="c")h+=q.o.map((o,j)=>`<button class="opt ${has?(j===q.a?"ok":(st.q.ans[i]===j?"no":"")):""}" data-q="${i}" data-o="${j}" ${has?"disabled":""}>${"ABCD"[j]}. ${o}</button>`).join("");
   else h+=`<div class="row" style="margin-top:6px"><input class="qin" id="qi${i}" value="${has?String(st.q.ans[i]).replace(/"/g,"&quot;"):""}" ${has?"disabled":""} placeholder="输入答案"/>${has?"":`<button class="b-sub" data-qf="${i}">确定</button>`}</div>`;
   if(has)h+=`<div class="fb ${ok?"ok":"bad"}" style="text-align:left">${ok?"✅ 正确。":"❌ 错了。正确答案："+(q.t==="c"?"ABCD"[q.a]+". "+q.o[q.a]:q.e)}　💡 ${q.e}</div>`;
   h+="</div>";});
  const wr=st.q.wrong.filter(i=>!st.q.fixed.includes(i));
  h+=`<div class="g"><h3>📕 错题本（${wr.length} 题待订正）</h3>${wr.length?wr.map(i=>`<div class="ln" style="margin:6px 0">${i+1}. ${QZ[i].q}<br>正确：<b>${QZ[i].t==="c"?QZ[i].o[QZ[i].a]:QZ[i].e}</b>${spkBtns(QZ[i].t==="c"?QZ[i].o[QZ[i].a]:QZ[i].e)} <button class="mini" data-fix="${i}">我已订正 ✓</button></div>`).join(""):"暂无错题 👍"}</div>`;
  P.innerHTML=h;
  P.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answer(+b.dataset.q,+b.dataset.o));
  P.querySelectorAll("[data-qf]").forEach(b=>{const i=+b.dataset.qf;b.onclick=()=>{const v=$("qi"+i).value.trim();if(v)answer(i,v);};$("qi"+i).onkeydown=e=>{if(e.key==="Enter")b.click();};});
  P.querySelectorAll("[data-fix]").forEach(b=>b.onclick=()=>{st.q.fixed.push(+b.dataset.fix);save();renderQuiz();});
  $("qReset").onclick=()=>{if(confirm("清空小测答案？（错题本保留）")){st.q.ans={};save();renderQuiz();}};
}
function answer(i,v){const st=S();st.q.ans[i]=v;if(!isRight(i,v)){if(!st.q.wrong.includes(i))st.q.wrong.push(i);st.q.fixed=st.q.fixed.filter(x=>x!==i);}save();const y=window.scrollY;renderQuiz();window.scrollTo(0,y);}

function renderMem(){
  const ws=S().w;const WW=W();const QZ=QUIZ();const miss=ws.missed.map(i=>WW[i]);
  const meta=DAY_META.find(x=>x.id===ALL.day);
  $("p-mem").innerHTML=`<div class="g"><h3>📊 ${meta.label} 进度</h3>单词：已掌握 ${ws.known.length}/${WW.length}，待重复 ${Object.values(ws.reps).filter(n=>n>0).length}，${ws.final?"收尾轮中":"第一轮"}<br>小测：已答 ${Object.keys(S().q.ans).length}/${QZ.length}，错题待订正 ${S().q.wrong.filter(i=>!S().q.fixed.includes(i)).length}<br>上次保存：${S().updated?new Date(S().updated).toLocaleString():"—"}</div>
 <div class="g"><h3>🧠 错过的词（收尾轮会复测）</h3>${miss.length?miss.map(w=>`<div class="sent"><b>${w.en}</b> ${w.ph} ${w.pos} ${w.zh}${spkBtns(w.en)}</div>`).join(""):"还没有错过的词"}</div>
 <div class="g"><h3>📚 本天全部词表</h3>${WW.map(w=>`<div class="sent">${w.unit} · <b>${w.en}</b> ${w.ph} ${w.pos} ${w.zh}${spkBtns(w.en)}</div>`).join("")}</div>
 <div class="g"><h3>四天总览</h3>${DAY_META.map(m=>{const s=ALL.days[m.id];return m.label+"：词 "+s.w.known.length+"/"+DAYS[m.id].W.length+" · 测 "+Object.keys(s.q.ans).length+"/"+DAYS[m.id].QUIZ.length;}).join("<br>")}</div>
 <div class="g"><h3>记忆方法</h3>模糊 → 再拼对 2 次；不会/拼错 → 再拼对 3 次；隔 3–8 词重现；最后收尾轮复测。<br>进度 key：<code>${KEY}</code>，按 Day 分别存。换电脑请用「💾 保存到电脑」。<div class="row" style="margin-top:8px"><button class="danger" id="mReset">⚠ 清空本天进度</button><button class="danger" id="mResetAll">⚠ 清空全部四天</button></div></div>`;
  $("mReset").onclick=()=>{if(confirm("确定清空本天进度？建议先「💾 保存到电脑」")){const v=ALL.voice;ALL.days[ALL.day]=dayDefault(ALL.day);ALL.voice=v;save();renderAll();}};
  $("mResetAll").onclick=()=>{if(confirm("确定清空全部四天进度？")){const v=ALL.voice;ALL=defaultAll();ALL.voice=v;save();renderAll();}};
}

function renderAll(){
  renderDayNav();
  const onDay=!!ALL.day;
  $("introPane").style.display=onDay?"none":"";
  ["p-words","p-grammar","p-dialogue","p-quiz","p-mem"].forEach(id=>{$(id).classList.remove("on");});
  if(!onDay){
    $("mainTitle").textContent="英语1B · 四天整合学习";
    $("mainSub").textContent="《英语1B基础模块（第三版）》Day1–Day4 · 单词拼写 → 语法 → 对话 → 小测";
    $("plan").textContent="📅 开屏：先看四天总计划，再点上方 Day1–Day4 开始";
    $("tabs").style.display="none";
    ["p-words","p-grammar","p-dialogue","p-quiz","p-mem"].forEach(id=>{$(id).classList.remove("on");$(id).style.display="none";});
    renderIntro();
    return;
  }
  ["p-words","p-grammar","p-dialogue","p-quiz","p-mem"].forEach(id=>{$(id).style.display="";});
  const meta=DAY_META.find(x=>x.id===ALL.day);
  $("mainTitle").textContent=meta.title;
  $("mainSub").textContent=meta.units+" · "+meta.grammar;
  $("plan").textContent=meta.plan;
  renderTabs();
  $("auto").checked=!!S().auto;
  if(S().tab==="words")renderWords();
  if(S().tab==="grammar")renderGrammar();
  if(S().tab==="dialogue")renderDialogue();
  if(S().tab==="quiz")renderQuiz();
  if(S().tab==="mem")renderMem();
}
load();renderAll();save();
window.addEventListener("pagehide",save);document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});

</script>
</body></html>
